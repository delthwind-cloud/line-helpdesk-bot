<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>問題回報</title>
  <style>
    :root {
      --green: #06c755;
      --green-dark: #05a647;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f6f7f9;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    header h1 { margin: 8px 0 2px; font-size: 22px; }
    header p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
    }
    label, .group-title { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    select, textarea {
      width: 100%;
      font: inherit;
      font-size: 16px; /* 避免 iOS 自動放大 */
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 140px; resize: vertical; }
    select:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
    .radios { display: flex; gap: 10px; }
    .radios label {
      flex: 1; margin: 0; font-weight: 500; text-align: center;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; cursor: pointer;
    }
    .radios input { position: absolute; opacity: 0; pointer-events: none; }
    .radios input:checked + span { color: var(--green-dark); font-weight: 700; }
    .radios label:has(input:checked) { border-color: var(--green); background: #effbf3; }
    .count { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; }
    button {
      width: 100%; font: inherit; font-size: 16px; font-weight: 700;
      color: #fff; background: var(--green); border: 0; border-radius: 12px;
      padding: 13px 0; cursor: pointer;
    }
    button:disabled { background: #a7e8c0; cursor: not-allowed; }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); margin-top: 10px; }
    .error {
      margin-top: 14px; padding: 10px 12px; border-radius: 10px;
      background: #fef2f2; color: var(--danger); font-size: 14px;
    }
    .done { text-align: center; padding: 28px 16px; }
    .done .tick { font-size: 44px; }
    .done h2 { margin: 6px 0; }
    .ticket {
      display: inline-block; margin: 8px 0 4px; padding: 6px 14px;
      border-radius: 999px; background: #effbf3; color: var(--green-dark);
      font-weight: 700; letter-spacing: .5px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tabs button {
      flex: 1; padding: 10px 0; font-size: 15px;
      background: #fff; color: var(--muted); border: 1px solid var(--line);
    }
    .tabs button.active { background: var(--green); color: #fff; border-color: var(--green); }
    .report { border-top: 1px solid var(--line); padding: 14px 0; }
    .report:first-child { border-top: 0; padding-top: 0; }
    .report:last-child { padding-bottom: 0; }
    .report .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .report .no { font-weight: 700; }
    .pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #f3f4f6; color: var(--muted); }
    .pill.status-處理中 { background: #fef3c7; color: #92400e; }
    .pill.status-已完成 { background: #effbf3; color: var(--green-dark); }
    .pill.urgent { background: #fee2e2; color: var(--danger); }
    .report .meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
    .report .desc { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>問題回報</h1>
      <p id="hello">載入中…</p>
    </header>

    <nav class="tabs" id="tabs" hidden>
      <button type="button" id="tab-new" class="active">填寫回報</button>
      <button type="button" id="tab-list">我的問題單</button>
    </nav>

    <form id="form" class="card" hidden novalidate>
      <div class="field">
        <label for="category">問題類別</label>
        <select id="category" required>
          <option value="">請選擇…</option>
          <option>帳號登入</option>
          <option>設備故障</option>
          <option>網路問題</option>
          <option>軟體操作</option>
          <option>其他</option>
        </select>
      </div>

      <div class="field">
        <span class="group-title">急迫程度</span>
        <div class="radios">
          <label><input type="radio" name="urgency" value="一般" checked /><span>一般</span></label>
          <label><input type="radio" name="urgency" value="急" /><span>急</span></label>
        </div>
      </div>

      <div class="field">
        <label for="description">問題描述</label>
        <textarea id="description" maxlength="500" required
          placeholder="發生了什麼事？在哪裡、什麼時候發生？"></textarea>
        <div class="count"><span id="count">0</span> / 500</div>
      </div>

      <button id="submit" type="submit">送出回報</button>
    </form>

    <section id="list" class="card" hidden></section>

    <section id="done" class="card done" hidden>
      <div class="tick">✅</div>
      <h2>已送出，謝謝你！</h2>
      <div>你的問題單號</div>
      <div class="ticket" id="ticket"></div>
      <p style="color:var(--muted);font-size:14px">我們會盡快處理。</p>
      <button id="again" class="secondary" type="button">再回報一筆</button>
      <button id="close" class="secondary" type="button" hidden>回到聊天</button>
    </section>

    <div id="error" class="error" role="alert" hidden></div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2012592327-yw2Y5kML"; // 不是機密，可以放在前端
    const $ = (id) => document.getElementById(id);

    function showError(message) {
      $("error").textContent = message;
      $("error").hidden = false;
    }
    function clearError() {
      $("error").hidden = true;
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        $("hello").textContent = `${profile.displayName}，請告訴我們你遇到什麼問題`;
        $("tabs").hidden = false;
        showView("new");
      } catch (err) {
        $("hello").textContent = "";
        showError("頁面初始化失敗，請從 LINE 重新開啟。（" + err.message + "）");
      }
    }

    // 三個畫面：new（表單）、list（我的問題單）、done（送出成功）
    function showView(name) {
      clearError();
      $("form").hidden = name !== "new";
      $("list").hidden = name !== "list";
      $("done").hidden = name !== "done";
      $("tabs").hidden = name === "done";
      $("tab-new").classList.toggle("active", name === "new");
      $("tab-list").classList.toggle("active", name === "list");
      if (name === "list") loadList();
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleString("zh-TW", {
        timeZone: "Asia/Taipei", month: "numeric", day: "numeric",
        hour: "2-digit", minute: "2-digit", hour12: false,
      });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text; // 一律用 textContent，避免 XSS
      return node;
    }

    async function loadList() {
      const box = $("list");
      box.replaceChildren(el("div", "empty", "載入中…"));
      try {
        const res = await fetch("/api/my-reports", {
          headers: { Authorization: "Bearer " + liff.getAccessToken() },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "讀取失敗，請稍後再試");
        if (!data.reports.length) {
          box.replaceChildren(el("div", "empty", "你還沒有送出過問題單"));
          return;
        }
        box.replaceChildren(
          ...data.reports.map((r) => {
            const item = el("div", "report");
            const top = el("div", "top");
            top.append(el("span", "no", "#" + r.ticketId), el("span", "pill status-" + r.status, r.status));
            if (r.urgency === "急") top.append(el("span", "pill urgent", "急"));
            item.append(top, el("div", "meta", r.category + "・" + formatTime(r.createdAt)), el("div", "desc", r.description));
            return item;
          })
        );
      } catch (err) {
        box.replaceChildren();
        showError(err.message);
      }
    }

    $("tab-new").addEventListener("click", () => showView("new"));
    $("tab-list").addEventListener("click", () => showView("list"));
    $("again").addEventListener("click", () => {
      $("description").value = "";
      $("count").textContent = "0";
      $("submit").disabled = false;
      $("submit").textContent = "送出回報";
      showView("new");
    });

    $("description").addEventListener("input", (e) => {
      $("count").textContent = e.target.value.length;
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const category = $("category").value;
      const description = $("description").value.trim();
      const urgency = document.querySelector('input[name="urgency"]:checked').value;
      if (!category) return showError("請選擇問題類別");
      if (!description) return showError("請描述你遇到的問題");

      const button = $("submit");
      button.disabled = true;
      button.textContent = "送出中…";

      try {
        const res = await fetch("/api/report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + liff.getAccessToken(),
          },
          body: JSON.stringify({ category, urgency, description }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "送出失敗，請稍後再試");

        $("ticket").textContent = "#" + data.ticketId;
        showView("done");

        // 在 LINE 內開啟時，代使用者在聊天室送一則訊息，機器人會用免費的回覆機制回應
        if (liff.isInClient()) {
          $("close").hidden = false;
          try {
            await liff.sendMessages([
              { type: "text", text: `【問題回報】單號 ${data.ticketId}` },
            ]);
          } catch (sendErr) {
            console.warn("sendMessages failed", sendErr);
          }
        }
      } catch (err) {
        showError(err.message);
        button.disabled = false;
        button.textContent = "送出回報";
      }
    });

    $("close").addEventListener("click", () => liff.closeWindow());

    main();
  </script>
</body>
</html>
